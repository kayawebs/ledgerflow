services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5532:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: ledgerflow_indexer
      CLICKHOUSE_USER: ledgerflow
      CLICKHOUSE_PASSWORD: ledgerflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  app:
    image: rust:1.92
    working_dir: /app
    command: sh -c "cargo run --bin ledgerflow"
    volumes:
      - .:/app
    env_file:
      - .env.example
    depends_on:
      - db
    ports:
      - "8180:8080"

  web:
    image: rust:1.92
    working_dir: /app
    command: sh -c "cargo run --bin web"
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      LEDGERFLOW_API_BASE_URL: http://app:8080
      LEDGERFLOW_WEB_BIND_ADDR: 0.0.0.0:3000
    depends_on:
      - app
    ports:
      - "3000:3000"

  indexer:
    image: rust:1.92
    working_dir: /app
    command: sh -c "cargo run --bin ledgerflow_indexer"
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      LEDGERFLOW_INDEXER_BIND_ADDR: 0.0.0.0:8090
      LEDGERFLOW_INDEXER_CLICKHOUSE_URL: http://clickhouse:8123
      LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE: ledgerflow_indexer
      LEDGERFLOW_INDEXER_CLICKHOUSE_USER: ledgerflow
      LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD: ledgerflow
      LEDGERFLOW_INDEXER_RPC_URL: ${LEDGERFLOW_INDEXER_RPC_URL:-https://mainnet.base.org}
    depends_on:
      - clickhouse
    ports:
      - "8090:8090"

volumes:
  postgres_data:
  clickhouse_data:
