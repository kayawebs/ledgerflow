      SOAK_OUTPUT: /reports/base-soak-results.csv
    volumes:
      - ./scripts/soak_test.sh:/scripts/soak_test.sh:ro
      - ./reports:/reports
    depends_on:
      app:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  clickhouse_data:

networks:
  public_evidence:
    name: ledgerflow-public-evidence
    external: true
