name: ledgerflow

x-ledgerflow-env: &ledgerflow-env
  env_file:
    - path: ${LEDGERFLOW_ENV_FILE:-.env}
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-ledgerflow-image: &ledgerflow-image
  image: ${LEDGERFLOW_IMAGE:-ledgerflow:latest}
  build:
    context: .

# Market web and projector ship in their own image (Dockerfile.market).
# Hard ceilings for the market services. This stack shares a host with a chain
# node, and an unthrottled backfill once took the load average from six to
# twenty and starved it. Override per deployment with the LEDGERFLOW_MARKET_*
# limit variables when the analytics stack has a machine of its own.
x-market-projector-limits: &market-projector-limits
  cpus: ${LEDGERFLOW_MARKET_PROJECTOR_CPUS:-6}
  mem_limit: ${LEDGERFLOW_MARKET_PROJECTOR_MEMORY:-8g}
  pids_limit: 512

x-market-web-limits: &market-web-limits
  cpus: ${LEDGERFLOW_MARKET_WEB_CPUS:-2}
  mem_limit: ${LEDGERFLOW_MARKET_WEB_MEMORY:-2g}
  pids_limit: 256

x-ledgerflow-market-image: &ledgerflow-market-image
  image: ${LEDGERFLOW_MARKET_IMAGE:-ledgerflow-market:latest}
  build:
    context: .
    dockerfile: Dockerfile.market

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerflow}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5532}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ledgerflow}"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: ${LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE:-ledgerflow_indexer}
      CLICKHOUSE_USER: ${LEDGERFLOW_INDEXER_CLICKHOUSE_USER:-ledgerflow}
      CLICKHOUSE_PASSWORD: ${LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD:-ledgerflow}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_HOST_PORT:-9002}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rpc-gateway:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow_rpc_gateway"]
    environment:
      LEDGERFLOW_RPC_GATEWAY_BIND_ADDR: 0.0.0.0:8545
      LEDGERFLOW_RPC_GATEWAY_UPSTREAM_URL: ${LEDGERFLOW_RPC_GATEWAY_UPSTREAM_URL:-http://host.docker.internal:18545}
      LEDGERFLOW_RPC_GATEWAY_MAX_IN_FLIGHT: ${LEDGERFLOW_RPC_GATEWAY_MAX_IN_FLIGHT:-8}
      LEDGERFLOW_RPC_GATEWAY_RPS: ${LEDGERFLOW_RPC_GATEWAY_RPS:-20}
      LEDGERFLOW_RPC_GATEWAY_BURST: ${LEDGERFLOW_RPC_GATEWAY_BURST:-20}
      LEDGERFLOW_RPC_GATEWAY_UPSTREAM_TIMEOUT_MS: ${LEDGERFLOW_RPC_GATEWAY_UPSTREAM_TIMEOUT_MS:-30000}
    ports:
      - "127.0.0.1:${LEDGERFLOW_RPC_GATEWAY_HOST_PORT:-18555}:8545"
    restart: unless-stopped

  app:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow"]
    environment:
      LEDGERFLOW_BIND_ADDR: 0.0.0.0:3000
      LEDGERFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
      LEDGERFLOW_RPC_URL: ${LEDGERFLOW_ANALYSIS_COMPOSE_RPC_URL:-${LEDGERFLOW_COMPOSE_RPC_URL:-http://rpc-gateway:8545}}
      LEDGERFLOW_DEFAULT_CHAIN_ID: ${LEDGERFLOW_DEFAULT_CHAIN_ID:-8453}
      LEDGERFLOW_INDEXER_API_BASE_URL: http://indexer:8090
    networks:
      - default
      - public_evidence
    depends_on:
      rpc-gateway:
        condition: service_started
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LEDGERFLOW_API_HOST_PORT:-3000}:3000"
    restart: unless-stopped

  web:
    <<: [*ledgerflow-env, *ledgerflow-image]
    profiles: ["legacy-web"]
    command: ["web"]
    environment:
      LEDGERFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
      LEDGERFLOW_API_BASE_URL: http://app:3000
      LEDGERFLOW_RPC_URL: ${LEDGERFLOW_COMPOSE_RPC_URL:-http://rpc-gateway:8545}
      LEDGERFLOW_WEB_BIND_ADDR: 0.0.0.0:3001
      LEDGERFLOW_WEB_BASE_URL: ${LEDGERFLOW_WEB_BASE_URL:-http://127.0.0.1:3001}
      LEDGERFLOW_WEB_DATABASE_MAX_CONNECTIONS: ${LEDGERFLOW_WEB_DATABASE_MAX_CONNECTIONS:-16}
      LEDGERFLOW_WEB_TODAY_CACHE_TTL_SECONDS: ${LEDGERFLOW_WEB_TODAY_CACHE_TTL_SECONDS:-60}
      LEDGERFLOW_PUBLIC_EVIDENCE_FEED_URL: ${LEDGERFLOW_PUBLIC_EVIDENCE_FEED_URL:-http://ledgerflow-base-pilot-web-1:3001/public/evidence/events.json}
      LEDGERFLOW_PUBLIC_EVIDENCE_CACHE_TTL_SECONDS: ${LEDGERFLOW_PUBLIC_EVIDENCE_CACHE_TTL_SECONDS:-15}
    networks:
      - default
      - public_evidence
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:${LEDGERFLOW_WEB_HOST_PORT:-3001}:3001"
    restart: unless-stopped

  market-web:
    <<: [*ledgerflow-env, *ledgerflow-market-image, *market-web-limits]
    command: ["ledgerflow_market_web"]
    environment:
      LEDGERFLOW_MARKET_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
      LEDGERFLOW_MARKET_WEB_BIND_ADDR: 0.0.0.0:3301
      LEDGERFLOW_MARKET_WEB_BASE_URL: ${LEDGERFLOW_MARKET_WEB_BASE_URL:-http://127.0.0.1:3001}
      LEDGERFLOW_MARKET_BASE_EVIDENCE_URL: ${LEDGERFLOW_MARKET_BASE_EVIDENCE_URL:-http://ledgerflow-base-pilot-web-1:3001/public/evidence/events.json}
      LEDGERFLOW_MARKET_REMOTE_CACHE_TTL_SECONDS: ${LEDGERFLOW_MARKET_REMOTE_CACHE_TTL_SECONDS:-30}
      LEDGERFLOW_MARKET_WALLET_CHALLENGE_TTL_SECONDS: ${LEDGERFLOW_MARKET_WALLET_CHALLENGE_TTL_SECONDS:-300}
      LEDGERFLOW_MARKET_WALLET_SESSION_TTL_SECONDS: ${LEDGERFLOW_MARKET_WALLET_SESSION_TTL_SECONDS:-604800}
    networks:
      - default
      - public_evidence
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LEDGERFLOW_MARKET_WEB_HOST_PORT:-3001}:3301"
    restart: unless-stopped

  market-seed-import:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command:
      - "ledgerflow_market_seed_import"
      - "config/intelligence/robinhood-market-protocols.v1.json"
      - "config/intelligence/robinhood-market-derived-domains.v1.json"
    environment:
      LEDGERFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  protocol-launch-indexer:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow_protocol_launch_indexer"]
    environment:
      LEDGERFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
      LEDGERFLOW_PROTOCOL_LAUNCH_RPC_URL: ${LEDGERFLOW_PROTOCOL_LAUNCH_COMPOSE_RPC_URL:-http://rpc-gateway:8545}
      LEDGERFLOW_PROTOCOL_LAUNCH_CHAIN_ID: ${LEDGERFLOW_PROTOCOL_LAUNCH_CHAIN_ID:-4663}
      LEDGERFLOW_PROTOCOL_LAUNCH_BATCH_SIZE: ${LEDGERFLOW_PROTOCOL_LAUNCH_BATCH_SIZE:-5000}
      LEDGERFLOW_PROTOCOL_LAUNCH_HEAD_LAG_BLOCKS: ${LEDGERFLOW_PROTOCOL_LAUNCH_HEAD_LAG_BLOCKS:-2}
      LEDGERFLOW_PROTOCOL_LAUNCH_LOOKBACK_BLOCKS: ${LEDGERFLOW_PROTOCOL_LAUNCH_LOOKBACK_BLOCKS:-128}
      LEDGERFLOW_PROTOCOL_LAUNCH_HEADER_BATCH_SIZE: ${LEDGERFLOW_PROTOCOL_LAUNCH_HEADER_BATCH_SIZE:-100}
      LEDGERFLOW_PROTOCOL_LAUNCH_METADATA_FETCH_LIMIT: ${LEDGERFLOW_PROTOCOL_LAUNCH_METADATA_FETCH_LIMIT:-8}
      LEDGERFLOW_PROTOCOL_LAUNCH_METADATA_FETCH_TIMEOUT_MS: ${LEDGERFLOW_PROTOCOL_LAUNCH_METADATA_FETCH_TIMEOUT_MS:-5000}
      LEDGERFLOW_PROTOCOL_LAUNCH_ACTIVE_DELAY_MS: ${LEDGERFLOW_PROTOCOL_LAUNCH_ACTIVE_DELAY_MS:-250}
      LEDGERFLOW_PROTOCOL_LAUNCH_POLL_INTERVAL_MS: ${LEDGERFLOW_PROTOCOL_LAUNCH_POLL_INTERVAL_MS:-2000}
      LEDGERFLOW_PROTOCOL_LAUNCH_ERROR_INTERVAL_MS: ${LEDGERFLOW_PROTOCOL_LAUNCH_ERROR_INTERVAL_MS:-10000}
    depends_on:
      rpc-gateway:
        condition: service_started
      market-seed-import:
        condition: service_completed_successfully
    restart: unless-stopped

  protocol-cluster-projector:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow_protocol_cluster_projector"]
    environment:
      LEDGERFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
      LEDGERFLOW_PROTOCOL_CLUSTER_CHAIN_ID: ${LEDGERFLOW_PROTOCOL_CLUSTER_CHAIN_ID:-4663}
      LEDGERFLOW_PROTOCOL_CLUSTER_MIN_REPEATED_LAUNCHES: ${LEDGERFLOW_PROTOCOL_CLUSTER_MIN_REPEATED_LAUNCHES:-2}
      LEDGERFLOW_PROTOCOL_CLUSTER_MIN_VERIFIED_EXECUTIONS: ${LEDGERFLOW_PROTOCOL_CLUSTER_MIN_VERIFIED_EXECUTIONS:-2}
      LEDGERFLOW_PROTOCOL_CLUSTER_POLL_INTERVAL_MS: ${LEDGERFLOW_PROTOCOL_CLUSTER_POLL_INTERVAL_MS:-60000}
      LEDGERFLOW_PROTOCOL_CLUSTER_ERROR_INTERVAL_MS: ${LEDGERFLOW_PROTOCOL_CLUSTER_ERROR_INTERVAL_MS:-15000}
    depends_on:
      market-seed-import:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: unless-stopped

  market-projector:
    <<: [*ledgerflow-env, *ledgerflow-market-image, *market-projector-limits]
    command: ["ledgerflow_market_projector"]
    environment:
      LEDGERFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
      # Local RPC only: total supply, arbitrage receipts and liquidation logs.
      LEDGERFLOW_MARKET_RPC_URL: ${LEDGERFLOW_MARKET_COMPOSE_RPC_URL:-http://rpc-gateway:8545}
      # LedgerFlow's canonical log store (ingested from the same local node).
      LEDGERFLOW_MARKET_CLICKHOUSE_URL: http://clickhouse:8123
      LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE: ${LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE:-ledgerflow_indexer}
      LEDGERFLOW_INDEXER_CLICKHOUSE_USER: ${LEDGERFLOW_INDEXER_CLICKHOUSE_USER:-ledgerflow}
      LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD: ${LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD:-ledgerflow}
      LEDGERFLOW_MARKET_CHAIN_ID: ${LEDGERFLOW_MARKET_CHAIN_ID:-4663}
      LEDGERFLOW_MARKET_POLL_INTERVAL_MS: ${LEDGERFLOW_MARKET_POLL_INTERVAL_MS:-3000}
      LEDGERFLOW_MARKET_ARBITRAGE_BACKFILL_DAYS: ${LEDGERFLOW_MARKET_ARBITRAGE_BACKFILL_DAYS:-2}
      LEDGERFLOW_MARKET_ARBITRAGE_RECEIPT_CONCURRENCY: ${LEDGERFLOW_MARKET_ARBITRAGE_RECEIPT_CONCURRENCY:-4}
      LEDGERFLOW_MARKET_LIQUIDATION_START_BLOCK: ${LEDGERFLOW_MARKET_LIQUIDATION_START_BLOCK:-0}
      # Backfills walk whole tables and are off unless asked for; a fresh start
      # should catch up with the chain, not with its history.
      LEDGERFLOW_MARKET_BACKFILL_ENABLED: ${LEDGERFLOW_MARKET_BACKFILL_ENABLED:-false}
      # Background work slows above the soft threshold and waits above the hard
      # one, both measured per core so they travel between machines.
      LEDGERFLOW_LOAD_SOFT_PER_CORE: ${LEDGERFLOW_LOAD_SOFT_PER_CORE:-0.7}
      LEDGERFLOW_LOAD_HARD_PER_CORE: ${LEDGERFLOW_LOAD_HARD_PER_CORE:-1.1}
      LEDGERFLOW_MARKET_LEADERBOARD_24H_SECONDS: ${LEDGERFLOW_MARKET_LEADERBOARD_24H_SECONDS:-300}
      LEDGERFLOW_MARKET_LEADERBOARD_7D_SECONDS: ${LEDGERFLOW_MARKET_LEADERBOARD_7D_SECONDS:-1800}
      LEDGERFLOW_MARKET_LEADERBOARD_30D_SECONDS: ${LEDGERFLOW_MARKET_LEADERBOARD_30D_SECONDS:-7200}
    depends_on:
      rpc-gateway:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  # Superseded by market-projector; kept behind a profile for reference.
  protocol-market-projector:
    profiles: ["legacy-market-projector"]
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow_protocol_market_projector"]
    environment:
      LEDGERFLOW_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ledgerflow}
      LEDGERFLOW_PROTOCOL_MARKET_CHAIN_ID: ${LEDGERFLOW_PROTOCOL_MARKET_CHAIN_ID:-4663}
      # Keep projection bounded to the recent, marketable data plane. Daily
      # participant outcomes are the P0 product; long-window outcome accounting
      # remains async work rather than a continuous database load.
      LEDGERFLOW_PROTOCOL_MARKET_BATCH_SIZE: ${LEDGERFLOW_PROTOCOL_MARKET_BATCH_SIZE:-10}
      LEDGERFLOW_PROTOCOL_MARKET_FACT_SCAN_LIMIT: ${LEDGERFLOW_PROTOCOL_MARKET_FACT_SCAN_LIMIT:-1000}
      LEDGERFLOW_PROTOCOL_MARKET_HISTORY_DAYS: ${LEDGERFLOW_PROTOCOL_MARKET_HISTORY_DAYS:-2}
      LEDGERFLOW_PROTOCOL_MARKET_POLL_INTERVAL_MS: ${LEDGERFLOW_PROTOCOL_MARKET_POLL_INTERVAL_MS:-5000}
      LEDGERFLOW_PROTOCOL_MARKET_ACTIVE_DELAY_MS: ${LEDGERFLOW_PROTOCOL_MARKET_ACTIVE_DELAY_MS:-5000}
      LEDGERFLOW_PROTOCOL_MARKET_ERROR_INTERVAL_MS: ${LEDGERFLOW_PROTOCOL_MARKET_ERROR_INTERVAL_MS:-15000}
    depends_on:
      protocol-launch-indexer:
        condition: service_started
      protocol-cluster-projector:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow_indexer"]
    environment:
      LEDGERFLOW_DEFAULT_CHAIN_ID: ${LEDGERFLOW_DEFAULT_CHAIN_ID:-8453}
      LEDGERFLOW_INDEXER_BIND_ADDR: 0.0.0.0:8090
      LEDGERFLOW_INDEXER_RPC_URL: ${LEDGERFLOW_INDEXER_LIVE_COMPOSE_RPC_URL:-${LEDGERFLOW_RPC_GATEWAY_UPSTREAM_URL:-http://host.docker.internal:8547}}
      LEDGERFLOW_INDEXER_CLICKHOUSE_URL: http://clickhouse:8123
      LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE: ${LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE:-ledgerflow_indexer}
      LEDGERFLOW_INDEXER_CLICKHOUSE_USER: ${LEDGERFLOW_INDEXER_CLICKHOUSE_USER:-ledgerflow}
      LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD: ${LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD:-ledgerflow}
      LEDGERFLOW_INDEXER_CHAIN_ID: ${LEDGERFLOW_INDEXER_CHAIN_ID:-8453}
      LEDGERFLOW_INDEXER_WORKER_MODE: live
      LEDGERFLOW_INDEXER_WORKER_ID: ${LEDGERFLOW_INDEXER_LIVE_WORKER_ID:-robinhood_live}
      LEDGERFLOW_INDEXER_LAZY_ENABLED: ${LEDGERFLOW_INDEXER_LAZY_ENABLED:-true}
      LEDGERFLOW_INDEXER_LAZY_WORKER_ENABLED: false
      LEDGERFLOW_INDEXER_LAZY_MAX_RANGE_BLOCKS: ${LEDGERFLOW_INDEXER_LAZY_MAX_RANGE_BLOCKS:-250000}
      LEDGERFLOW_INDEXER_LIVE_HEAD_LAG_BLOCKS: ${LEDGERFLOW_INDEXER_LIVE_HEAD_LAG_BLOCKS:-2}
      LEDGERFLOW_INDEXER_LIVE_BOOTSTRAP_BLOCKS: ${LEDGERFLOW_INDEXER_LIVE_BOOTSTRAP_BLOCKS:-128}
      # Live completeness is independent from the intentionally lightweight
      # history worker. Disabling historical receipts must never disable live
      # receipts/logs.
      LEDGERFLOW_INDEXER_HISTORY_INCLUDE_RECEIPTS: ${LEDGERFLOW_INDEXER_LIVE_INCLUDE_RECEIPTS:-true}
      LEDGERFLOW_INDEXER_REORG_LOOKBACK_BLOCKS: ${LEDGERFLOW_INDEXER_REORG_LOOKBACK_BLOCKS:-128}
      LEDGERFLOW_INDEXER_POLL_INTERVAL_MS: ${LEDGERFLOW_INDEXER_LIVE_POLL_INTERVAL_MS:-200}
      LEDGERFLOW_INDEXER_BATCH_SIZE: ${LEDGERFLOW_INDEXER_LIVE_BATCH_SIZE:-20}
      LEDGERFLOW_INDEXER_RPC_CONCURRENCY: ${LEDGERFLOW_INDEXER_LIVE_RPC_CONCURRENCY:-4}
      LEDGERFLOW_INDEXER_RPC_BATCH_REQUEST_SIZE: 1
      LEDGERFLOW_INDEXER_ENDPOINT_BACKFILL_ENABLED: false
    networks:
      - default
      - public_evidence
    depends_on:
      rpc-gateway:
        condition: service_started
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LEDGERFLOW_INDEXER_HOST_PORT:-8090}:8090"
    restart: unless-stopped

  indexer-lazy:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow_indexer"]
    environment:
      LEDGERFLOW_DEFAULT_CHAIN_ID: ${LEDGERFLOW_DEFAULT_CHAIN_ID:-4663}
      LEDGERFLOW_INDEXER_CHAIN_ID: ${LEDGERFLOW_INDEXER_CHAIN_ID:-4663}
      LEDGERFLOW_INDEXER_API_ENABLED: false
      LEDGERFLOW_INDEXER_RPC_URL: ${LEDGERFLOW_INDEXER_COMPOSE_RPC_URL:-http://rpc-gateway:8545}
      LEDGERFLOW_INDEXER_CLICKHOUSE_URL: http://clickhouse:8123
      LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE: ${LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE:-ledgerflow_indexer}
      LEDGERFLOW_INDEXER_CLICKHOUSE_USER: ${LEDGERFLOW_INDEXER_CLICKHOUSE_USER:-ledgerflow}
      LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD: ${LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD:-ledgerflow}
      LEDGERFLOW_INDEXER_WORKER_MODE: lazy
      LEDGERFLOW_INDEXER_WORKER_ID: ${LEDGERFLOW_INDEXER_LAZY_WORKER_ID:-robinhood_lazy}
      LEDGERFLOW_INDEXER_LAZY_ENABLED: true
      LEDGERFLOW_INDEXER_LAZY_WORKER_ENABLED: false
      LEDGERFLOW_INDEXER_LAZY_MAX_RANGE_BLOCKS: ${LEDGERFLOW_INDEXER_LAZY_MAX_RANGE_BLOCKS:-250000}
      LEDGERFLOW_INDEXER_BATCH_SIZE: ${LEDGERFLOW_INDEXER_LAZY_BATCH_SIZE:-20}
      LEDGERFLOW_INDEXER_RPC_CONCURRENCY: ${LEDGERFLOW_INDEXER_LAZY_RPC_CONCURRENCY:-1}
      LEDGERFLOW_INDEXER_RPC_BATCH_REQUEST_SIZE: 1
      LEDGERFLOW_INDEXER_RPC_REQUEST_DELAY_MS: ${LEDGERFLOW_INDEXER_LAZY_REQUEST_DELAY_MS:-100}
      LEDGERFLOW_INDEXER_HISTORY_INCLUDE_RECEIPTS: ${LEDGERFLOW_INDEXER_LAZY_INCLUDE_RECEIPTS:-true}
      LEDGERFLOW_INDEXER_ENDPOINT_BACKFILL_ENABLED: false
    depends_on:
      rpc-gateway:
        condition: service_started
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  indexer-history:
    <<: [*ledgerflow-env, *ledgerflow-image]
    profiles: ["full-history"]
    command: ["ledgerflow_indexer"]
    environment:
      LEDGERFLOW_DEFAULT_CHAIN_ID: ${LEDGERFLOW_DEFAULT_CHAIN_ID:-4663}
      LEDGERFLOW_INDEXER_API_ENABLED: false
      LEDGERFLOW_INDEXER_RPC_URL: ${LEDGERFLOW_INDEXER_HISTORY_COMPOSE_RPC_URL:-${LEDGERFLOW_RPC_GATEWAY_UPSTREAM_URL:-http://host.docker.internal:8547}}
      LEDGERFLOW_INDEXER_CLICKHOUSE_URL: http://clickhouse:8123
      LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE: ${LEDGERFLOW_INDEXER_CLICKHOUSE_DATABASE:-ledgerflow_indexer}
      LEDGERFLOW_INDEXER_CLICKHOUSE_USER: ${LEDGERFLOW_INDEXER_CLICKHOUSE_USER:-ledgerflow}
      LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD: ${LEDGERFLOW_INDEXER_CLICKHOUSE_PASSWORD:-ledgerflow}
      LEDGERFLOW_INDEXER_CHAIN_ID: ${LEDGERFLOW_INDEXER_CHAIN_ID:-4663}
      LEDGERFLOW_INDEXER_WORKER_MODE: history
      LEDGERFLOW_INDEXER_WORKER_ID: ${LEDGERFLOW_INDEXER_HISTORY_WORKER_ID:-robinhood_history}
      LEDGERFLOW_INDEXER_HISTORY_BOUNDARY_WORKER_ID: ${LEDGERFLOW_INDEXER_HISTORY_BOUNDARY_WORKER_ID:-${LEDGERFLOW_INDEXER_LIVE_WORKER_ID:-robinhood_live}}
      LEDGERFLOW_INDEXER_HISTORY_INCLUDE_RECEIPTS: ${LEDGERFLOW_INDEXER_HISTORY_INCLUDE_RECEIPTS:-false}
      LEDGERFLOW_INDEXER_HISTORY_RECEIPT_MODE: ${LEDGERFLOW_INDEXER_HISTORY_RECEIPT_MODE:-transaction}
      LEDGERFLOW_INDEXER_START_BLOCK: ${LEDGERFLOW_INDEXER_HISTORY_START_BLOCK:-0}
      LEDGERFLOW_INDEXER_HISTORY_HEAD_LAG_BLOCKS: ${LEDGERFLOW_INDEXER_HISTORY_HEAD_LAG_BLOCKS:-128}
      LEDGERFLOW_INDEXER_LAZY_ENABLED: false
      LEDGERFLOW_INDEXER_LAZY_WORKER_ENABLED: false
      LEDGERFLOW_INDEXER_BATCH_SIZE: ${LEDGERFLOW_INDEXER_HISTORY_BATCH_SIZE:-200}
      LEDGERFLOW_INDEXER_RPC_CONCURRENCY: ${LEDGERFLOW_INDEXER_HISTORY_RPC_CONCURRENCY:-16}
      LEDGERFLOW_INDEXER_RPC_BATCH_REQUEST_SIZE: ${LEDGERFLOW_INDEXER_HISTORY_RPC_BATCH_REQUEST_SIZE:-4}
      LEDGERFLOW_INDEXER_RPC_REQUEST_DELAY_MS: ${LEDGERFLOW_INDEXER_HISTORY_RPC_REQUEST_DELAY_MS:-0}
      LEDGERFLOW_INDEXER_RPC_REQUEST_TIMEOUT_MS: ${LEDGERFLOW_INDEXER_HISTORY_RPC_REQUEST_TIMEOUT_MS:-30000}
      LEDGERFLOW_INDEXER_INTER_BATCH_DELAY_MS: ${LEDGERFLOW_INDEXER_HISTORY_INTER_BATCH_DELAY_MS:-100}
      LEDGERFLOW_INDEXER_POLL_INTERVAL_MS: ${LEDGERFLOW_INDEXER_HISTORY_POLL_INTERVAL_MS:-5000}
      LEDGERFLOW_INDEXER_ENDPOINT_BACKFILL_ENABLED: false
    depends_on:
      rpc-gateway:
        condition: service_started
      clickhouse:
        condition: service_healthy
      indexer:
        condition: service_started
    restart: on-failure

  registry-sync:
    <<: [*ledgerflow-env, *ledgerflow-image]
    command: ["ledgerflow_registry_sync"]
    environment:
